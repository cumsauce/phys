<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>phys</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {"imports": {"three": "./vendor/three.module.min.js"}}
  </script>
</head>
<body>
  <header>
    <span class="brand">phys</span>
    <button id="filebtn" class="quiet" title="New, open and save"><span id="file">untitled</span> <small>▾</small></button>
    <div class="group">
      <button id="undo" class="icon" title="Undo (Cmd/Ctrl+Z)">↶</button>
      <button id="redo" class="icon" title="Redo (Shift+Cmd/Ctrl+Z)">↷</button>
    </div>
    <button id="viewbtn" class="quiet" title="What the view shows, and whether edits are heard">View <small>▾</small></button>
    <div class="spacer"></div>
    <div id="tuner" class="dim" title="The pitch of the part you last played">
      <b id="tuner_note">—</b>
      <span class="needle"><i id="tuner_needle"></i></span>
      <span id="tuner_hz"></span>
    </div>
    <div class="spacer"></div>
    <div class="group" id="takebox" title="Everything you play is remembered as a take">
      <button id="render" title="Replay the take offline into a WAV file">Render take</button>
      <button id="clear" class="icon" title="Forget the take">✕</button>
    </div>
    <span class="meter" title="Output level"><i id="level"></i></span>
    <input type="range" id="volume" min="0" max="2" step="0.01" value="1" title="Volume">
  </header>

  <main>
    <nav id="rail"></nav>

    <div id="view">
      <div id="labels"></div>
      <div id="hint"></div>
      <div id="gizmo" class="float group">
        <button data-mode="translate" title="Move the selection (` switches)">Move</button>
        <button data-mode="rotate" title="Rotate the selection (` switches)">Rotate</button>
      </div>
      <div id="viewbtns" class="float group">
        <button data-view="fit" title="Fit the selection, or everything, in view (\ or Home)">Fit</button>
        <button data-view="front" title="Look from the front">Front</button>
        <button data-view="side" title="Look from the side">Side</button>
        <button data-view="top" title="Look from above">Top</button>
      </div>
      <div id="toast"></div>
      <div id="tip"></div>
      <div id="menu"></div>

      <div id="dock">
        <div class="hand">
          <div class="group" id="hand">
            <button data-hand="strike" title="A mallet thrown at the point">Strike</button>
            <button data-hand="pluck" title="Pull the point aside and let go">Pluck</button>
            <button data-hand="bow" title="Hold the mouse down on a part to bow it there">Bow</button>
          </div>
          <div class="knobs" data-for="strike">
            <label title="How fast the mallet arrives">Speed <input type="range" id="speed" min="0.2" max="8" step="0.1" value="2"><output id="speed_out"></output></label>
            <label title="What the mallet's head is made of">Head <input type="range" id="hard" min="5" max="10" step="0.1" value="8"><output id="hard_out"></output></label>
            <label title="The mallet's mass">Mass <input type="range" id="mass" min="-3" max="-0.3" step="0.05" value="-1.7"><output id="mass_out"></output></label>
          </div>
          <div class="knobs" data-for="pluck">
            <label title="How far the point is pulled aside">Pull <input type="range" id="pull" min="0.5" max="12" step="0.1" value="3"><output id="pull_out"></output></label>
          </div>
          <div class="knobs" data-for="bow">
            <label title="How fast the bow travels">Speed <input type="range" id="bowspeed" min="0.02" max="1" step="0.01" value="0.2"><output id="bowspeed_out"></output></label>
            <label title="How hard the bow presses (scroll while bowing)">Press <input type="range" id="pressure" min="-1.7" max="0.5" step="0.02" value="-0.5"><output id="pressure_out"></output></label>
          </div>
        </div>
        <div class="keys">
          <div id="keys"></div>
          <button id="assign" title="Give each selected part (or every string and bar) a key, left to right">Assign keys</button>
          <button id="hush" title="Stop all sound (Space)">Hush</button>
        </div>
      </div>
    </div>

    <aside id="inspector"></aside>
  </main>

  <footer>
    <span id="conn" class="bad">connecting…</span>
    <span id="path"></span>
    <span id="stats"></span>
    <span id="load"></span>
    <span class="spacer"></span>
    <span id="midi" class="dim"></span>
  </footer>

  <div id="pop"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
